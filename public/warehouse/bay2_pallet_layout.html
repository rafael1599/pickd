<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bay 2 Norte — Pallet Layout</title>
<style>
    *{ box-sizing:border-box; margin:0; padding:0; }
    body{
        background:#070b14;
        color:#e2e8f0;
        font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
        min-height:100vh;
        overflow-x:hidden;
        user-select:none;
    }

    header{ position:relative; z-index:2; padding:22px 30px 6px; }
    h1{ font-size:15px; font-weight:800; letter-spacing:.22em; color:#f8fafc; }
    .tagline{ font-size:11px; letter-spacing:.16em; color:#475569; margin-top:5px; font-family:ui-monospace,monospace; }

    .stage{ position:relative; z-index:1; padding:8px 30px 40px; display:flex; gap:40px; }

    .layout-box{
        flex:1; border:1px solid #1e293b; border-radius:8px; padding:20px;
        background:rgba(15,23,42,.5);
    }

    .layout-box h2{ font-size:13px; font-weight:800; letter-spacing:.1em; margin-bottom:12px; }
    .layout-box h2.v-a{ color:#f59e0b; }
    .layout-box h2.v-b{ color:#a78bfa; }

    .stats{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:20px; }
    .stat-item{ font-family:ui-monospace,monospace; font-size:11px; }
    .stat-item .k{ color:#64748b; letter-spacing:.1em; }
    .stat-item .v{ font-size:16px; font-weight:800; margin-top:2px; }
    .stat-item.v-a .v{ color:#f59e0b; }
    .stat-item.v-b .v{ color:#a78bfa; }

    .config-text{ font-size:10px; color:#64748b; line-height:1.6; margin:16px 0; font-family:ui-monospace,monospace; }

    svg{ width:100%; height:auto; max-height:600px; }
    svg .pallet{ cursor:pointer; transition:opacity .2s; }
    svg .pallet:hover{ opacity:.8; }

    footer{ position:relative; z-index:2; padding:0 30px 30px; font-size:9px; color:#334155; font-family:ui-monospace,monospace; }
</style>
</head>
<body>

<div class="sidebar">
    <h2>SAVED CONFIGS</h2>
    <button class="btn" style="width:100%; text-align:center; margin-bottom:10px;" onclick="saveConfig()">+ SAVE CURRENT</button>
    <div id="savedList" style="display:flex; flex-direction:column; gap:10px;"></div>
</div>

<header>
    <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:20px; flex-wrap:wrap;">
        <div>
            <h1>BAY 2 NORTE — PALLET LAYOUT</h1>
            <p class="tagline" id="taglineDesc">ROWS RUNNING N-S (HALLS N-S)</p>
        </div>
        <div style="display:flex; gap:10px; align-items:center;">
            <label style="font-size:11px; font-family:ui-monospace,monospace; color:#64748b; display:flex; align-items:center; gap:6px;">
                PALLET
                <input type="range" id="inpPD" min="55" max="65" value="60" style="width:80px; accent-color:#00eeff; cursor:pointer;"> <span id="valPD" style="color:#00eeff; font-weight:bold;">60"</span> D &times;
                <input type="range" id="inpPW" min="57" max="67" value="62" style="width:80px; accent-color:#00eeff; cursor:pointer;"> <span id="valPW" style="color:#00eeff; font-weight:bold;">62"</span> W
            </label>
            <div id="toggles" style="display:none;"></div>
            <button id="backBtn" style="
                padding:9px 16px; border:1px solid #1e293b; border-radius:6px;
                background:rgba(15,23,42,.8); color:#e2e8f0; cursor:pointer;
                font-size:11px; letter-spacing:.1em; font-weight:600;
                transition:all .2s; font-family:ui-monospace,monospace; display:inline-block;
            " onmouseover="this.style.borderColor='#64748b'; this.style.background='rgba(30,41,59,.8)'"
               onmouseout="this.style.borderColor='#1e293b'; this.style.background='rgba(15,23,42,.8)'">
                ← MAP
            </button>
        </div>
    </div>
</header>

<div class="stage" style="display:block;">
    <div class="layout-box">
        <div class="stats" id="stats-box" style="display:flex; gap:28px; padding-bottom:10px; border-bottom:1px solid rgba(255,255,255,0.05); margin-bottom:20px;">
            <!-- Dynamically populated by engine -->
            <div class="stat-item"><div class="k">LOADING...</div></div>
        </div>
        
        <div class="config-text" id="config-text" style="display:flex; justify-content:space-between;"></div>
        
        <div style="position:relative; width:100%; display:flex; justify-content:center; margin-top:20px;">
            <svg id="layout-svg" style="max-height: calc(100vh - 280px); object-fit: contain;"></svg>
        </div>
    </div>
</div>

<footer>
* Estimate: 2 pallets per "slot" (1 up, 1 down across levels). Uses exact math from PalletEngine.
</footer>

<style>
    .switch button {
        padding:9px 15px; border:0; background:rgba(15,23,42,.5); color:#64748b;
        font-family:ui-monospace,monospace; font-size:11px; letter-spacing:.1em; font-weight:700;
        cursor:pointer; transition:background .2s, color .2s; white-space:nowrap;
    }
    .switch button:hover { color:#e2e8f0; }
    .switch button.on { background:#34d399; color:#070b14; }
    
    .stats .stat-item { font-family:ui-monospace,monospace; }
    .stats .stat-item .k { font-size:9.5px; letter-spacing:.14em; color:#64748b; }
    .stats .stat-item .v { font-size:28px; font-weight:800; margin-top:6px; color:#22d3ee; font-variant-numeric:tabular-nums; line-height:1; }
</style>

<script type="module">
import { ZONES } from './zones.js';
import { PalletEngine } from './PalletEngine.js';

const config = ZONES['bay2_north'];
const isEW = false; // Locked to N-S rows
let pw = 62;
let pd = 60;
let hallOverrides = {};

const valPD = document.getElementById('valPD');
const valPW = document.getElementById('valPW');

document.getElementById('inpPD').addEventListener('input', e => { 
    pd = parseFloat(e.target.value) || 60; 
    valPD.textContent = pd + '"';
    render(); 
});
document.getElementById('inpPW').addEventListener('input', e => { 
    pw = parseFloat(e.target.value) || 62; 
    valPW.textContent = pw + '"';
    render(); 
});

window.openHallSlider = (e, idx, currentSize) => {
    let popup = document.getElementById('hall-slider-popup');
    if (!popup) {
        popup = document.createElement('div');
        popup.id = 'hall-slider-popup';
        popup.style.cssText = "position:absolute; background:#1e293b; color:#e2e8f0; padding:12px; border-radius:8px; box-shadow:0 10px 25px rgba(0,0,0,0.5); z-index:1000; border:1px solid #334155; display:flex; flex-direction:column; gap:8px; font-family:var(--mono, ui-monospace, monospace); font-size:12px;";
        document.body.appendChild(popup);
    }
    
    let val = hallOverrides[idx] || currentSize;
    
    popup.innerHTML = `
        <div style="display:flex; justify-content:space-between; margin-bottom:4px;">
            <strong>Hall ${idx + 1} Width</strong>
            <button id="hallSliderReset" style="background:none; border:none; color:#ef4444; cursor:pointer; font-size:10px;">RESET</button>
        </div>
        <div style="display:flex; gap:10px; align-items:center;">
            <input type="range" id="hallSliderInp" min="${Math.max(54, currentSize - 20)}" max="${currentSize + 20}" value="${val}" style="width:120px; accent-color:#00eeff; cursor:pointer;">
            <span id="hallSliderVal" style="color:#00eeff; font-weight:bold; min-width:30px;">${val}"</span>
        </div>
        <button onclick="document.getElementById('hall-slider-popup').style.display='none'" style="margin-top:4px; background:rgba(255,255,255,0.1); border:none; color:white; padding:4px; border-radius:4px; cursor:pointer;">Close</button>
    `;
    
    popup.style.display = 'flex';
    popup.style.left = (e.pageX + 15) + 'px';
    popup.style.top = (e.pageY + 15) + 'px';
    
    document.getElementById('hallSliderReset').onclick = () => {
        popup.style.display='none'; 
        delete hallOverrides[idx]; 
        render();
    };
    
    document.getElementById('hallSliderInp').addEventListener('input', (ev) => {
        const v = parseInt(ev.target.value);
        document.getElementById('hallSliderVal').textContent = v + '"';
        hallOverrides[idx] = v;
        render();
    });
};

// Saved Configs Logic
const getSavedKey = () => `pickd_layout_configs_bay2_north`;
let savedConfigs = JSON.parse(localStorage.getItem(getSavedKey()) || '[]');

function renderSavedList() {
    const list = document.getElementById('savedList');
    list.innerHTML = '';
    savedConfigs.forEach((cfg, idx) => {
        const item = document.createElement('div');
        item.className = 'saved-item';
        item.innerHTML = `
            <button class="saved-item-del" onclick="event.stopPropagation(); deleteConfig(${idx})">X</button>
            <div class="saved-item-title">${cfg.name}</div>
            <div class="saved-item-info">PD:${cfg.state.pd}" PW:${cfg.state.pw}" Overrides:${Object.keys(cfg.state.hallOverrides).length}</div>
        `;
        item.onclick = () => loadConfig(idx);
        list.appendChild(item);
    });
}

window.saveConfig = () => {
    const name = prompt("Configuration name:", `Layout ${new Date().toLocaleTimeString()}`);
    if (!name) return;
    savedConfigs.push({
        name,
        state: { pw, pd, isEW, hallOverrides: JSON.parse(JSON.stringify(hallOverrides)) }
    });
    localStorage.setItem(getSavedKey(), JSON.stringify(savedConfigs));
    renderSavedList();
};

window.loadConfig = (idx) => {
    const cfg = savedConfigs[idx];
    if (!cfg) return;
    pw = cfg.state.pw;
    pd = cfg.state.pd;
    hallOverrides = JSON.parse(JSON.stringify(cfg.state.hallOverrides || {}));
    
    document.getElementById('inpPD').value = pd;
    valPD.textContent = pd + '"';
    document.getElementById('inpPW').value = pw;
    valPW.textContent = pw + '"';
    
    render();
};

window.deleteConfig = (idx) => {
    if (!confirm("Delete configuration?")) return;
    savedConfigs.splice(idx, 1);
    localStorage.setItem(getSavedKey(), JSON.stringify(savedConfigs));
    renderSavedList();
};

function render() {
    const engine = new PalletEngine('bay2_north', config, { pw, pd, isEW, hallOverrides });
    const m = engine.calculate();
    
    const svg = document.getElementById('layout-svg');
    const stats = document.getElementById('stats-box');
    const text = document.getElementById('config-text');
    const tagline = document.getElementById('taglineDesc');
    
    tagline.textContent = "ROWS RUNNING N-S (HALLS N-S)";
    
    if (!m) {
        stats.innerHTML = `<div class="stat-item"><div class="k">ERROR</div><div class="v" style="color:#ef4444">NO FITS</div></div>`;
        return;
    }
    
    // Update SVG
    svg.setAttribute('viewBox', `0 0 ${config.width + 192} ${config.height + 192}`);
    svg.innerHTML = engine.renderSVG(m);
    
    // Update Stats
    stats.innerHTML = `
        <div class="stat-item">
            <div class="k">ROWS</div>
            <div class="v">${m.nRows}</div>
        </div>
        <div class="stat-item">
            <div class="k">SLOTS DEEP</div>
            <div class="v">${m.deep}</div>
        </div>
        <div class="stat-item">
            <div class="k">TOTAL SLOTS</div>
            <div class="v">${m.pallets}</div>
        </div>
        <div class="stat-item">
            <div class="k">CAPACIDAD APROX*</div>
            <div class="v" style="color:#34d399">${m.pallets * 2} <span style="font-size:12px;color:#64748b">pallets</span></div>
        </div>
        <div class="stat-item">
            <div class="k">TOTAL BIKES</div>
            <div class="v" style="color:#39ff14">${new Intl.NumberFormat().format(m.palletBikes + m.bikes)}</div>
        </div>
    `;
    
    // Update Config Text
    text.innerHTML = `
        <span><strong>Halls:</strong> ${m.nHalls > 0 ? Math.round(54 + m.extra / m.nHalls) + '"' : 'None'} (${m.nHalls} halls)</span>
        <span><strong>Blocks:</strong> ${m.blocks.join(' + ')} rows per block</span>
        <span><strong>Posts hit:</strong> ${m.hits.length > 0 ? '<span style="color:#ef4444;font-weight:bold">' + m.hits.length + '</span>' : 'None'}</span>
    `;
}

render();
renderSavedList();
PalletEngine.attachTooltip(document.getElementById('layout-svg'));

// Back button
document.getElementById('backBtn').addEventListener('click', () => {
    window.location.href = 'warehouse_map.html';
});
</script>
</body>
</html>
